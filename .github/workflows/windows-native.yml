name: Native Windows HUD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            node: "22"
          - python: "3.12"
            node: "24"
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Isolate CLI and HUD settings
        shell: pwsh
        run: |
          "CODEX_HOME=$(Join-Path $env:RUNNER_TEMP 'codex-hud-empty-home')" >> $env:GITHUB_ENV
          "CODEX_HUD_CONFIG_HOME=$(Join-Path $env:RUNNER_TEMP 'codex-hud-empty-settings')" >> $env:GITHUB_ENV
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: native/package-lock.json
      - name: Install native ConPTY dependencies
        shell: pwsh
        run: npm ci --prefix native --include=optional --no-audit --no-fund
      - name: Install pinned official npm CLI for alias discovery regression
        shell: pwsh
        run: |
          $cliPrefix = Join-Path $env:RUNNER_TEMP 'codex-hud-official-npm'
          npm install --global --prefix $cliPrefix --no-audit --no-fund --ignore-scripts @openai/codex@0.162.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CODEX_HUD_OFFICIAL_NPM_ROOT=$cliPrefix" >> $env:GITHUB_ENV
      - name: Verify portable Python behavior and Windows installation
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import sys
          import unittest

          patterns = (
              "test_agents.py", "test_config.py", "test_display.py", "test_sources.py",
              "test_native_bridge.py", "test_keys.py", "test_windows_setup.py", "test_skills.py",
          )
          suite = unittest.TestSuite()
          for pattern in patterns:
              if not (Path("tests") / pattern).is_file():
                  raise SystemExit(f"Missing required Windows test file: {pattern}")
              suite.addTests(unittest.defaultTestLoader.discover("tests", pattern=pattern))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify real ConPTY terminal and JSONL bridge without model requests
        if: ${{ !cancelled() }}
        shell: pwsh
        run: node --test tests/native_terminal.test.cjs
